org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Cloud features (beat maps from GitHub Pages, TV -> cloud trigger). Leave unset for local
# builds: the app then simply has no cloud features. CI sets these from github.repository
# through the DANCEDANCE_PAGES_BASE_URL / DANCEDANCE_GITHUB_REPO environment variables.
# dancedance.pagesBaseUrl=https://OWNER.github.io/REPO/
# dancedance.githubRepo=OWNER/REPO
