# Cloud beat maps: every hour, read the playlist (repo variable PLAYLIST_URL)
# plus the starter pack, analyse songs that have no beat map yet, commit the
# JSON under public/ and redeploy the site.
#
# Audio is downloaded to the runner's temp dir, decoded, analysed and deleted
# straight away. It is never committed, cached or uploaded as an artifact.
#
# Note: GitHub disables scheduled workflows after 60 days without activity in
# the repository. It emails you first; re-enable with the "Enable workflow"
# button on this workflow's page under the Actions tab.
#
# "Add a song" (from the web app, or by hand under Run workflow): fill in
# add_artist + add_title (and add_duration, the official length in seconds;
# looked up on iTunes when empty). The job finds the best YouTube video for
# it, makes its beat map and lists it in public/songs.json. Songs it can't
# find are reported in public/songs-status.json. Such a run skips the
# playlist; the next hourly run reads it as usual.
#
# "Contributed beat map" (input map_json, sent by the relay's POST /map): a
# beat map a player's browser made by listening to the song (source 'tab') or
# by analysing a local download ('device'). The job validates it strictly,
# publishes it only for a known song that has no better map, and never
# downloads anything on such a run, so it is fast and can't be bot-blocked.
# These runs are named "Contributed beat map". A wrong map can be fixed by
# deleting public/beatmaps/<videoId>.json (or by running the tool locally,
# which replaces 'tab' maps with real analyses).
#
# Settings used (all optional):
#   vars.PLAYLIST_URL     playlist link (Public or Unlisted)
#   vars.YTDLP_VERSION    pin yt-dlp to a release tag, e.g. 2026.10.26 (default: latest)
#   secrets.YT_COOKIES    cookies.txt from a SPARE Google account, if YouTube bot-blocks the runner
#   secrets.COOKIE_REFRESH_TOKEN  fine-grained token for this repo with only "Secrets: read and
#                         write". With it, the job saves the cookies YouTube refreshes during
#                         a run back into YT_COOKIES, and makes one signed-in request a day,
#                         so the session lasts longer. It cannot sign in again by itself:
#                         when YouTube ends the session, export fresh cookies by hand.
name: Beat maps
# Runs started by the app show the song, so you can find them under Actions.
run-name: "${{ inputs.map_json && 'Contributed beat map' || inputs.add_title && format('Add song: {0} - {1}', inputs.add_artist, inputs.add_title) || 'Beat maps' }}"

on:
  schedule:
    - cron: '23 * * * *'
    # Once a day: also make one small signed-in request so the YT_COOKIES
    # session stays in use (see "Keep the YouTube session fresh" below).
    - cron: '47 9 * * *'
  workflow_dispatch:
    inputs:
      video_id:
        description: Only this YouTube video ID (leave empty for the whole playlist)
        type: string
        required: false
        default: ''
      force:
        description: Re-analyse even if a beat map already exists
        type: boolean
        required: false
        default: false
      add_artist:
        description: 'Add a song by search: artist'
        type: string
        required: false
        default: ''
      add_title:
        description: 'Add a song by search: song title'
        type: string
        required: false
        default: ''
      add_duration:
        description: 'Add a song by search: official length in seconds (empty = look it up)'
        type: string
        required: false
        default: ''
      add_queue:
        description: Used by the app (other songs it is still waiting for, as JSON); leave empty
        type: string
        required: false
        default: ''
      map_json:
        description: Used by the relay (a contributed beat map, as JSON); leave empty
        type: string
        required: false
        default: ''

# Never run two of these at once; a new run waits for the current one.
# Contributed-map runs get a group of their own each, so they never replace a
# waiting add-a-song run (GitHub keeps only one waiting run per group); they
# only write a few small files and redo their work if their push races another run.
concurrency:
  group: ${{ inputs.map_json && format('beatmaps-map-{0}', github.run_id) || 'beatmaps' }}
  cancel-in-progress: false

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install ffmpeg
        if: ${{ !inputs.map_json }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          ffmpeg -hide_banner -version | head -n 1

      # Current yt-dlp needs an external JavaScript runtime for YouTube; Deno is
      # the one it enables by default (https://github.com/yt-dlp/yt-dlp/wiki/EJS).
      - uses: denoland/setup-deno@v2
        if: ${{ !inputs.map_json }}
        with:
          deno-version: v2.x

      - name: Install yt-dlp
        if: ${{ !inputs.map_json }}
        env:
          YTDLP_VERSION: ${{ vars.YTDLP_VERSION }}
        run: |
          set -euo pipefail
          if [ -n "${YTDLP_VERSION:-}" ]; then
            if ! printf '%s' "$YTDLP_VERSION" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$'; then
              echo "::error title=Bad YTDLP_VERSION::YTDLP_VERSION must look like 2026.10.26 (a yt-dlp release tag)"
              exit 1
            fi
            base="https://github.com/yt-dlp/yt-dlp/releases/download/${YTDLP_VERSION}"
          else
            base="https://github.com/yt-dlp/yt-dlp/releases/latest/download"
          fi
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          cd "$bin"
          # The standalone Linux build bundles the YouTube challenge solver scripts.
          curl -fsSL --retry 3 -o yt-dlp_linux "$base/yt-dlp_linux"
          curl -fsSL --retry 3 -o SHA2-256SUMS "$base/SHA2-256SUMS"
          grep -E ' yt-dlp_linux$' SHA2-256SUMS | sha256sum --check --strict
          mv yt-dlp_linux yt-dlp
          chmod +x yt-dlp
          echo "$bin" >> "$GITHUB_PATH"
          ./yt-dlp --version

      - name: Make beat maps
        id: run
        if: ${{ !inputs.map_json }}
        env:
          PLAYLIST_URL: ${{ vars.PLAYLIST_URL }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          YT_COOKIES_OUT: ${{ runner.temp }}/yt-cookies.txt
          ONLY_VIDEO: ${{ inputs.video_id }}
          FORCE: ${{ inputs.force }}
          # Free text from the app or the form: only ever used as quoted arguments.
          ADD_ARTIST: ${{ inputs.add_artist }}
          ADD_TITLE: ${{ inputs.add_title }}
          ADD_DURATION: ${{ inputs.add_duration }}
          ADD_QUEUE: ${{ inputs.add_queue }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${ONLY_VIDEO:-}" ]; then args+=(--only "$ONLY_VIDEO"); fi
          if [ "${FORCE:-}" = "true" ]; then args+=(--force); fi
          if [ -n "${ADD_TITLE:-}" ] || [ -n "${ADD_ARTIST:-}" ]; then
            args+=(--add-artist "${ADD_ARTIST:-}" --add-title "${ADD_TITLE:-}")
            if [ -n "${ADD_DURATION:-}" ]; then args+=(--add-duration "$ADD_DURATION"); fi
          fi
          if [ -n "${ADD_QUEUE:-}" ]; then args+=(--add-queue "$ADD_QUEUE"); fi
          npm run --silent beatmaps -- "${args[@]}"

      # Optional (needs both YT_COOKIES and COOKIE_REFRESH_TOKEN). YouTube hands
      # out refreshed cookies while a signed-in session is used, and yt-dlp writes
      # them to its cookie file. This step stores that file as the new YT_COOKIES
      # secret. On the daily run it first asks YouTube for the details of one
      # already-published song (no audio is downloaded), so the session is used
      # at least once a day. Cookies are never printed and the file is deleted.
      - name: Keep the YouTube session fresh
        if: ${{ !cancelled() && !inputs.map_json }}
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          GH_TOKEN: ${{ secrets.COOKIE_REFRESH_TOKEN }}
          DAILY: ${{ github.event.schedule == '47 9 * * *' }}
          RUN_OUTCOME: ${{ steps.run.outcome }}
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/yt-cookies.txt"
          trap 'rm -f "$jar"' EXIT
          if [ -z "${YT_COOKIES:-}" ] || [ -z "${GH_TOKEN:-}" ]; then
            echo "Cookie refresh is not set up (needs YT_COOKIES and COOKIE_REFRESH_TOKEN); skipping."
            exit 0
          fi
          if [ ! -s "$jar" ]; then
            (umask 077; printf '%s\n' "$YT_COOKIES" | tr -d '\r' > "$jar")
          fi
          if [ "$DAILY" = "true" ]; then
            id=$(node -e 'const a=require("./public/beatmaps/index.json").ids||[];if(a.length)console.log(a[Math.floor(Math.random()*a.length)])')
            if [ -z "$id" ]; then echo "No published song to ask about; skipping."; exit 0; fi
            if yt-dlp --cookies "$jar" --skip-download --no-warnings --print id -- "$id" >/dev/null 2>&1; then
              echo "Daily signed-in request succeeded."
            else
              echo "::warning title=YouTube session::The daily signed-in request failed. The YT_COOKIES session may have ended: export fresh cookies if downloads are blocked."
              exit 0
            fi
          elif [ "$RUN_OUTCOME" != "success" ]; then
            echo "The beat map step did not succeed; leaving the secret as it is."
            exit 0
          fi
          # Compare cookie lines only (yt-dlp rewrites the header and the order).
          lines() { tr -d '\r' | grep -Ev '^(# .*|#|[[:space:]]*)$' | sort | sha256sum; }
          before=$(printf '%s\n' "$YT_COOKIES" | lines)
          after=$(lines < "$jar")
          if [ "$before" = "$after" ]; then echo "Cookies unchanged."; exit 0; fi
          # Never replace the secret with something that is not a signed-in YouTube session.
          if ! grep -Eq $'\t(SAPISID|__Secure-3PAPISID|LOGIN_INFO)\t' "$jar" || ! grep -q 'youtube\.com' "$jar"; then
            echo "::warning title=YouTube session::The refreshed cookie file has no sign-in cookies; leaving the secret as it is."
            exit 0
          fi
          if [ "$(wc -c < "$jar")" -gt 45000 ]; then
            echo "::warning title=YouTube session::The refreshed cookie file is too large for a secret; leaving it as it is."
            exit 0
          fi
          if gh secret set YT_COOKIES --repo "$GITHUB_REPOSITORY" < "$jar" >/dev/null 2>"$RUNNER_TEMP/gh-err.txt"; then
            echo "Saved the refreshed cookies to YT_COOKIES."
          else
            # GitHub's reason (an HTTP status and message; it never contains the cookies).
            head -n 3 "$RUNNER_TEMP/gh-err.txt" | cut -c1-300
            echo "::warning title=YouTube session::Could not save the refreshed cookies. Check that COOKIE_REFRESH_TOKEN has 'Secrets: read and write' on this repository and has not expired."
          fi

      # Runs even when the previous step failed (e.g. bot-blocked), so that
      # status.json still records what happened and the app can show it.
      # A contributed map (map_json) is handled here too: it needs no
      # downloads, and if the push races another run it starts again from
      # the newest commit instead of rebasing (the tool is quick and deterministic).
      - name: Commit beat maps
        id: commit
        if: ${{ !cancelled() }}
        env:
          BRANCH: ${{ github.ref_name }}
          # Untrusted JSON from the relay: only ever read by the tool from the environment.
          MAP_JSON: ${{ inputs.map_json }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          stage() {
            # Only JSON under public/ is ever staged: never audio, never anything else.
            paths=(public/beatmaps)
            for f in public/playlist.json public/songs.json public/songs-status.json; do
              if [ -e "$f" ]; then paths+=("$f"); fi
            done
            git add -A -- "${paths[@]}"
            if git diff --cached --name-only | grep -Ev '^public/(beatmaps/[A-Za-z0-9_-]+|playlist|songs|songs-status)\.json$'; then
              echo "::error title=Unexpected files::Refusing to commit files other than beat-map JSON"
              exit 1
            fi
          }
          if [ -n "${MAP_JSON:-}" ]; then
            for attempt in 1 2 3 4 5; do
              npm run --silent beatmaps -- --contributed-map
              stage
              if git diff --cached --quiet; then
                echo "No changes to commit."
                echo "changed=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              git commit -q -m "Contributed beat map (heard in a browser)"
              if git push -q origin "HEAD:${BRANCH}"; then break; fi
              if [ "$attempt" = 5 ]; then exit 1; fi
              sleep $((attempt * 3))
              git fetch -q origin "$BRANCH"
              git reset -q --hard "origin/${BRANCH}"
            done
          else
            stage
            if git diff --cached --quiet; then
              echo "No changes to commit."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            count=$(git diff --cached --name-only -- 'public/beatmaps/*.json' | grep -Evc '/(index|status)\.json$' || true)
            msg="Update beat maps (${count} map file(s) changed)"
            if ! git diff --cached --quiet -- public/songs.json 2>/dev/null; then msg="Add song(s) by search; ${msg}"; fi
            git commit -q -m "$msg"
            for attempt in 1 2 3; do
              if git push -q origin "HEAD:${BRANCH}"; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
              git pull -q --rebase origin "$BRANCH"
            done
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Pushes made with GITHUB_TOKEN don't trigger deploy.yml, so deploy from here.
  deploy:
    needs: update
    if: ${{ always() && needs.update.outputs.changed == 'true' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.update.outputs.sha }}
