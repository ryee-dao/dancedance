[versions]
agp = "8.13.2"
kotlin = "2.3.21"
# ---------------------------------------------------------------------------------------------
# NewPipe Extractor reads playlists and audio streams from YouTube. When the app says
# "YouTube changed something", bump this ONE line to the newest release from
# https://github.com/TeamNewPipe/NewPipeExtractor/releases and cut a new app release.
newpipeExtractor = "v0.27.1"
# ---------------------------------------------------------------------------------------------
desugar = "2.1.5"
# 4.x on purpose: OkHttp 5.x requires compileSdk 37.
okhttp = "4.12.0"
coroutines = "1.11.0"
webkit = "1.12.1"
nanohttpd = "2.3.1"
zxing = "3.5.4"
junit = "4.13.2"
json = "20250517"

[libraries]
newpipe-extractor = { module = "com.github.TeamNewPipe:NewPipeExtractor", version.ref = "newpipeExtractor" }
android-desugar = { module = "com.android.tools:desugar_jdk_libs_nio", version.ref = "desugar" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
nanohttpd = { module = "org.nanohttpd:nanohttpd", version.ref = "nanohttpd" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
junit = { module = "junit:junit", version.ref = "junit" }
json = { module = "org.json:json", version.ref = "json" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
