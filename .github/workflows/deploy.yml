# Build the web app and publish it to GitHub Pages.
#
# Runs on every push to main, by hand (Actions -> Deploy site -> Run workflow),
# and from beatmaps.yml after it commits new beat maps (pushes made with
# GITHUB_TOKEN do not start other workflows, so that job calls this one).
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
# Optional repository variable: ADD_SONG_URL (see README, "Optional: Cloudflare relay").
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to build (defaults to the commit that triggered the run)
        type: string
        required: false
        default: ''
      data_only:
        description: Only song data changed (beat maps, song lists), so skip the type-check and tests
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          # When called from beatmaps.yml, build the commit it just pushed
          # (github.sha would still be the commit from before the new maps).
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The type-check and tests guard code changes. A commit that only changes song
      # data (a new beat map, the song lists) is published without them: they take
      # minutes, and a test that looks at every published song must not keep a newly
      # added song off the site (it reports on the next code push instead).
      # beatmaps.yml says so itself (data_only); for a push, compare what it changed.
      # When that can't be worked out, the checks run.
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          DATA_ONLY: ${{ inputs.data_only }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          checks=true
          if [ "$DATA_ONLY" = "true" ]; then
            checks=false
          elif [ "$EVENT" = "push" ] && printf '%s' "$BEFORE" | grep -Eq '^[0-9a-f]{40}$' && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            if files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$AFTER" --jq '.files[].filename' 2>/dev/null); then
              n=$(printf '%s\n' "$files" | grep -c . || true)
              other=$(printf '%s\n' "$files" | grep -Evc '^(public/(beatmaps/[A-Za-z0-9_-]+|playlist|songs|songs-status|genres)\.json)?$' || true)
              # The compare API lists at most 300 files: a full page may hide others.
              if [ "$n" -gt 0 ] && [ "$n" -lt 300 ] && [ "$other" -eq 0 ]; then checks=false; fi
            fi
          fi
          echo "checks=$checks" >> "$GITHUB_OUTPUT"
          if [ "$checks" = "false" ]; then echo "Only song data changed: publishing without the type-check and tests." >> "$GITHUB_STEP_SUMMARY"; fi

      - if: ${{ steps.scope.outputs.checks == 'true' }}
        run: npm run typecheck
      - if: ${{ steps.scope.outputs.checks == 'true' }}
        run: npm test
      # Optional: address of the "add a song" Cloudflare relay (repository
      # variable ADD_SONG_URL). When the variable is unset, the value committed
      # in .env is used; an empty environment variable would override it, so it
      # is only exported when it has a value.
      - run: |
          if [ -n "$ADD_SONG_URL" ]; then export VITE_ADD_SONG_URL="$ADD_SONG_URL"; fi
          npm run build
        env:
          ADD_SONG_URL: ${{ vars.ADD_SONG_URL }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only one Pages deployment at a time; a newer one waits instead of cancelling.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
