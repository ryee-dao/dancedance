# Cloud beat maps: every hour, read the playlist (repo variable PLAYLIST_URL)
# plus the starter pack, analyse songs that have no beat map yet, commit the
# JSON under public/ and redeploy the site.
#
# Audio is downloaded to the runner's temp dir, decoded, analysed and deleted
# straight away. It is never committed, cached or uploaded as an artifact.
#
# Note: GitHub disables scheduled workflows after 60 days without activity in
# the repository. It emails you first; re-enable with the "Enable workflow"
# button on this workflow's page under the Actions tab.
#
# "Add a song" (from the web app, or by hand under Run workflow): fill in
# add_artist + add_title (and add_duration, the official length in seconds;
# looked up on iTunes when empty). The job finds the best YouTube video for
# it, makes its beat map and lists it in public/songs.json. Songs it can't
# find are reported in public/songs-status.json. Such a run skips the
# playlist; the next hourly run reads it as usual. With add_video (a video ID
# from a link the person pasted after "not found"), the job checks that video
# against the same rules instead of searching: it is added when it matches;
# otherwise songs-status.json says why ('video-mismatch') and nothing is added,
# unless add_video_force is set ("Use it anyway" in the app).
#
# "Contributed beat map" (input map_json, sent by the relay's POST /map): a
# beat map a player's browser made by listening to the song (source 'tab') or
# by analysing a local download ('device'). The job validates it strictly,
# publishes it only for a known song that has no better map, and never
# downloads anything on such a run, so it is fast and can't be bot-blocked.
# These runs are named "Contributed beat map". A wrong map can be fixed by
# deleting public/beatmaps/<videoId>.json (or by running the tool locally,
# which replaces 'tab' maps with real analyses).
#
# Settings used (all optional):
#   vars.PLAYLIST_URL     playlist link (Public or Unlisted)
#   vars.YTDLP_VERSION    pin yt-dlp to a release tag, e.g. 2026.10.26 (default: latest)
#   vars.POT_PROVIDER     'off' skips the PO token provider (see "Start the PO token provider")
#   secrets.YT_COOKIES    cookies.txt from a SPARE Google account, if YouTube bot-blocks the runner
#   secrets.COOKIE_REFRESH_TOKEN  fine-grained token for this repo with only "Secrets: read and
#                         write". With it, the job saves the cookies YouTube refreshes during
#                         a run back into YT_COOKIES, and makes one signed-in request on
#                         every scheduled run (after a random wait), so the session lasts longer. At the first
#                         rejection it stops asking (secrets.YT_SESSION_REJECTED, written by
#                         the job) until YT_COOKIES is replaced. It cannot sign in again by
#                         itself: when YouTube ends the session, export fresh cookies by hand.
name: Beat maps
# Runs started by the app show the song, so you can find them under Actions.
run-name: "${{ inputs.map_json && 'Contributed beat map' || inputs.add_title && format('Add song: {0} - {1}', inputs.add_artist, inputs.add_title) || 'Beat maps' }}"

on:
  schedule:
    - cron: '23 * * * *'
    # A second hourly slot: GitHub skips most scheduled starts, and two slots bring the
    # real pace closer to one run every couple of hours.
    - cron: '53 * * * *'
  workflow_dispatch:
    inputs:
      video_id:
        description: Only this YouTube video ID (leave empty for the whole playlist)
        type: string
        required: false
        default: ''
      force:
        description: Re-analyse even if a beat map already exists
        type: boolean
        required: false
        default: false
      add_artist:
        description: 'Add a song by search: artist'
        type: string
        required: false
        default: ''
      add_title:
        description: 'Add a song by search: song title'
        type: string
        required: false
        default: ''
      add_duration:
        description: 'Add a song by search: official length in seconds (empty = look it up)'
        type: string
        required: false
        default: ''
      add_video:
        description: 'Add a song by search: use this YouTube video ID instead of searching (empty = search)'
        type: string
        required: false
        default: ''
      add_video_force:
        description: "Add a song by search: add the video above even if it doesn't look like the song"
        type: boolean
        required: false
        default: false
      add_queue:
        description: Used by the app (other songs it is still waiting for, as JSON); leave empty
        type: string
        required: false
        default: ''
      session_only:
        description: Only check the YouTube sign-in (YT_COOKIES); make no beat maps
        type: boolean
        required: false
        default: false
      map_json:
        description: Used by the relay (a contributed beat map, as JSON); leave empty
        type: string
        required: false
        default: ''

# Never run two of these at once; a new run waits for the current one.
# Contributed-map runs get a group of their own each, so they never replace a
# waiting add-a-song run (GitHub keeps only one waiting run per group); they
# only write a few small files and redo their work if their push races another run.
concurrency:
  group: ${{ inputs.map_json && format('beatmaps-map-{0}', github.run_id) || 'beatmaps' }}
  cancel-in-progress: false

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      # The branch as it is now, not the commit from when the run was requested: a run that waited
      # behind another one must start from what that one pushed, or its own push is rejected.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install ffmpeg
        if: ${{ !inputs.map_json }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          ffmpeg -hide_banner -version | head -n 1

      # Current yt-dlp needs an external JavaScript runtime for YouTube; Deno is
      # the one it enables by default (https://github.com/yt-dlp/yt-dlp/wiki/EJS).
      - uses: denoland/setup-deno@v2
        if: ${{ !inputs.map_json }}
        with:
          deno-version: v2.x

      - name: Install yt-dlp
        if: ${{ !inputs.map_json }}
        env:
          YTDLP_VERSION: ${{ vars.YTDLP_VERSION }}
        run: |
          set -euo pipefail
          if [ -n "${YTDLP_VERSION:-}" ]; then
            if ! printf '%s' "$YTDLP_VERSION" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$'; then
              echo "::error title=Bad YTDLP_VERSION::YTDLP_VERSION must look like 2026.10.26 (a yt-dlp release tag)"
              exit 1
            fi
            base="https://github.com/yt-dlp/yt-dlp/releases/download/${YTDLP_VERSION}"
          else
            base="https://github.com/yt-dlp/yt-dlp/releases/latest/download"
          fi
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          cd "$bin"
          # The standalone Linux build bundles the YouTube challenge solver scripts.
          curl -fsSL --retry 3 -o yt-dlp_linux "$base/yt-dlp_linux"
          curl -fsSL --retry 3 -o SHA2-256SUMS "$base/SHA2-256SUMS"
          grep -E ' yt-dlp_linux$' SHA2-256SUMS | sha256sum --check --strict
          mv yt-dlp_linux yt-dlp
          chmod +x yt-dlp
          echo "$bin" >> "$GITHUB_PATH"
          ./yt-dlp --version

      # Optional, fail-soft: a PO token provider (https://github.com/yt-dlp/yt-dlp/wiki/PO-Token-Guide).
      # Signed in, YouTube can refuse the media of web clients with HTTP 403 unless the request carries a
      # "proof of origin" token. bgutil-ytdlp-pot-provider makes them: a server (Docker image, pinned by
      # digest, port bound to 127.0.0.1 only, no files of this runner mounted, so it never sees the cookie
      # jar) plus a small yt-dlp plugin (zip, pinned by SHA-256, read in review: it sends the server only
      # the token request, never cookies). The plugin sits next to the yt-dlp binary in yt-dlp-plugins/,
      # which yt-dlp searches even with --ignore-config. If anything here fails, the job runs as before
      # (no provider) with a warning. Turn it off with the repository variable POT_PROVIDER=off.
      # To update: bump all three pins together (the plugin warns when its version differs from the server's).
      - name: Start the PO token provider
        id: pot
        if: ${{ !inputs.map_json && !inputs.session_only && vars.POT_PROVIDER != 'off' }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          POT_IMAGE: brainicism/bgutil-ytdlp-pot-provider:2.0.2@sha256:d7d34108b76e52c7d3b575fe9e797e4bf41c1b2a08f80c5292eff6f851ce8472
          POT_PLUGIN_URL: https://github.com/Brainicism/bgutil-ytdlp-pot-provider/releases/download/2.0.2/bgutil-ytdlp-pot-provider.zip
          POT_PLUGIN_SHA256: a26b980bf6d8e8400d8f21445daa4d8381bf6183d20f0be309391f86b31e27ef
        run: |
          set -uo pipefail
          skip() { echo "::warning title=PO token provider not used::$1 The job goes on without it, as before."; exit 0; }
          docker run --name bgutil-provider -d --init --restart no -p 127.0.0.1:4416:4416 "$POT_IMAGE" >/dev/null \
            || skip "Could not start its container."
          ping=''
          for _ in $(seq 1 45); do
            if ping=$(curl -fsS --max-time 2 http://127.0.0.1:4416/ping 2>/dev/null); then break; fi
            ping=''
            sleep 1
          done
          if [ -z "$ping" ]; then
            docker logs --tail 20 bgutil-provider 2>&1 | cut -c1-200 || true
            skip "Its server did not answer on 127.0.0.1:4416 within 45 s."
          fi
          echo "Provider server answered: $(printf '%s' "$ping" | tr -d '\r\n' | cut -c1-200)"
          zip="$RUNNER_TEMP/bgutil-ytdlp-pot-provider.zip"
          curl -fsSL --retry 3 -o "$zip" "$POT_PLUGIN_URL" || skip "Could not download its yt-dlp plugin."
          echo "$POT_PLUGIN_SHA256  $zip" | sha256sum --check --strict || skip "Its yt-dlp plugin did not match the pinned checksum."
          plugins="$(dirname "$(command -v yt-dlp)")/yt-dlp-plugins"
          mkdir -p "$plugins" && mv "$zip" "$plugins/" || skip "Could not install its yt-dlp plugin."
          # Does yt-dlp see it? One request WITHOUT cookies for a published song, debug header only
          # (non-secret lines: plugin folders, PO token providers, and whether a token was made).
          id=$(node -e 'const a=require("./public/beatmaps/index.json").ids||[];if(a.length)console.log(a[0])' 2>/dev/null || true)
          if [ -n "$id" ]; then
            yt-dlp --ignore-config -v --simulate --no-progress -- "$id" 2>&1 \
              | grep -E 'Plugin directories|PO Token Providers|PO Token for|bgutil' | grep -v 'Executing command' | cut -c1-240 | head -n 8 || true
          fi
          echo "YTDLP_POT_PROVIDER=bgutil:http-2.0.2" >> "$GITHUB_ENV"
          echo "PO token provider ready (bgutil 2.0.2)."
          echo "PO token provider: ready (bgutil 2.0.2)." >> "$GITHUB_STEP_SUMMARY"

      - name: Make beat maps
        id: run
        if: ${{ !inputs.map_json && !inputs.session_only }}
        env:
          PLAYLIST_URL: ${{ vars.PLAYLIST_URL }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          YT_COOKIES_OUT: ${{ runner.temp }}/yt-cookies.txt
          ONLY_VIDEO: ${{ inputs.video_id }}
          FORCE: ${{ inputs.force }}
          # Free text from the app or the form: only ever used as quoted arguments.
          ADD_ARTIST: ${{ inputs.add_artist }}
          ADD_TITLE: ${{ inputs.add_title }}
          ADD_DURATION: ${{ inputs.add_duration }}
          ADD_VIDEO: ${{ inputs.add_video }}
          ADD_VIDEO_FORCE: ${{ inputs.add_video_force }}
          ADD_QUEUE: ${{ inputs.add_queue }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${ONLY_VIDEO:-}" ]; then args+=(--only "$ONLY_VIDEO"); fi
          if [ "${FORCE:-}" = "true" ]; then args+=(--force); fi
          if [ -n "${ADD_TITLE:-}" ] || [ -n "${ADD_ARTIST:-}" ]; then
            args+=(--add-artist "${ADD_ARTIST:-}" --add-title "${ADD_TITLE:-}")
            if [ -n "${ADD_DURATION:-}" ]; then args+=(--add-duration "$ADD_DURATION"); fi
            # Checked by the tool (an 11-character video ID, else it stops with an error).
            if [ -n "${ADD_VIDEO:-}" ]; then
              args+=(--add-video "$ADD_VIDEO")
              if [ "${ADD_VIDEO_FORCE:-}" = "true" ]; then args+=(--add-video-force); fi
            fi
          fi
          if [ -n "${ADD_QUEUE:-}" ]; then args+=(--add-queue "$ADD_QUEUE"); fi
          npm run --silent beatmaps -- "${args[@]}"

      # Optional (needs both YT_COOKIES and COOKIE_REFRESH_TOKEN). YouTube hands
      # out refreshed cookies while a signed-in session is used, and yt-dlp writes
      # them to its cookie file. This step stores that file as the new YT_COOKIES
      # secret. On every scheduled run, after a random
      # wait, it first asks YouTube for the details of one already-published song
      # (no audio is downloaded), so the session stays in use, and it stops asking at the first rejection (until the cookies are
      # replaced). Cookies are never printed and the file is deleted.
      - name: Keep the YouTube session fresh
        id: session
        if: ${{ !cancelled() && !inputs.map_json }}
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          GH_TOKEN: ${{ secrets.COOKIE_REFRESH_TOKEN }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
          SESSION_ONLY: ${{ inputs.session_only }}
          REJECTED_AT: ${{ secrets.YT_SESSION_REJECTED }}
          RUN_OUTCOME: ${{ steps.run.outcome }}
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/yt-cookies.txt"
          trap 'rm -f "$jar"' EXIT
          if [ -z "${YT_COOKIES:-}" ] || [ -z "${GH_TOKEN:-}" ]; then
            echo "Cookie refresh is not set up (needs YT_COOKIES and COOKIE_REFRESH_TOKEN); skipping."
            exit 0
          fi
          if [ ! -s "$jar" ]; then
            (umask 077; printf '%s\n' "$YT_COOKIES" | tr -d '\r' > "$jar")
          fi
          # Stop at the first rejection: once YouTube has refused this session, no more
          # signed-in requests are made until YT_COOKIES is replaced. The marker is the
          # secret's "last updated" time at the moment of the rejection, kept in the
          # secret YT_SESSION_REJECTED; new cookies change that time and lift the stop.
          updated=$(gh api "repos/$GITHUB_REPOSITORY/actions/secrets/YT_COOKIES" --jq .updated_at 2>/dev/null || true)
          if [ -n "$updated" ] && [ "$updated" = "${REJECTED_AT:-}" ]; then
            echo "::warning title=YouTube sign-in is rejected::YouTube rejected these cookies earlier, so no signed-in request was made. Export fresh cookies into YT_COOKIES to start again."
            printf '%s\n\n%s\n' '### :warning: YouTube sign-in is rejected' 'YouTube refused the `YT_COOKIES` session on an earlier run. No signed-in requests are made until you export fresh cookies into `YT_COOKIES`.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$SCHEDULED" = "true" ] || [ "$SESSION_ONLY" = "true" ]; then
            # Every scheduled run, after a random wait of 0 to 90 s (to the millisecond). The
            # wait is short because app requests (add a song) queue behind this job. GitHub
            # starts scheduled runs late and skips many, so the times are irregular anyway.
            wait_ms=0
            if [ "$SCHEDULED" = "true" ]; then wait_ms=$(node -e 'console.log(require("crypto").randomInt(0, 90001))'); fi
            sleep "$(printf '%d.%03d' $((wait_ms / 1000)) $((wait_ms % 1000)))"
            id=$(node -e 'const a=require("./public/beatmaps/index.json").ids||[];if(a.length)console.log(a[Math.floor(Math.random()*a.length)])')
            if [ -z "$id" ]; then echo "No published song to ask about; skipping."; exit 0; fi
            err="$RUNNER_TEMP/yt-keepalive-err.txt"
            if yt-dlp --cookies "$jar" --skip-download --no-warnings --print id -- "$id" >/dev/null 2>"$err"; then
              rm -f "$err"
              echo "Signed-in request succeeded."
              echo "YouTube sign-in: the signed-in request succeeded." >> "$GITHUB_STEP_SUMMARY"
            elif grep -Eiq 'not a bot|sign in to confirm|cookies are no longer valid|account has been|login required' "$err"; then
              rm -f "$err"
              echo "::error title=YouTube rejected the sign-in::YouTube rejected the signed-in request: the YT_COOKIES session has ended. No more requests are made until you export fresh cookies into YT_COOKIES."
              printf '%s\n\n%s\n' '### :x: YouTube rejected the sign-in' 'The `YT_COOKIES` session has ended. No more signed-in requests are made until you export fresh cookies into `YT_COOKIES` (README: "When a job goes red").' >> "$GITHUB_STEP_SUMMARY"
              echo "rejected=true" >> "$GITHUB_OUTPUT"
              if [ -n "$updated" ]; then
                gh secret set YT_SESSION_REJECTED --repo "$GITHUB_REPOSITORY" --body "$updated" >/dev/null 2>&1 || echo "Could not record the rejection; the next run will ask again."
              fi
              exit 0
            else
              rm -f "$err"
              echo "The signed-in request failed for another reason (network, or that video); trying again next run."
              exit 0
            fi
          elif [ "$RUN_OUTCOME" != "success" ]; then
            echo "The beat map step did not succeed; leaving the secret as it is."
            exit 0
          fi
          # Compare cookie lines only (yt-dlp rewrites the header and the order).
          lines() { tr -d '\r' | grep -Ev '^(# .*|#|[[:space:]]*)$' | sort | sha256sum; }
          before=$(printf '%s\n' "$YT_COOKIES" | lines)
          after=$(lines < "$jar")
          if [ "$before" = "$after" ]; then echo "Cookies unchanged."; exit 0; fi
          # Never replace the secret with something that is not a signed-in YouTube session.
          if ! grep -Eq $'\t(SAPISID|__Secure-3PAPISID|LOGIN_INFO)\t' "$jar" || ! grep -q 'youtube\.com' "$jar"; then
            echo "::warning title=YouTube session::The refreshed cookie file has no sign-in cookies; leaving the secret as it is."
            exit 0
          fi
          if [ "$(wc -c < "$jar")" -gt 45000 ]; then
            echo "::warning title=YouTube session::The refreshed cookie file is too large for a secret; leaving it as it is."
            exit 0
          fi
          if gh secret set YT_COOKIES --repo "$GITHUB_REPOSITORY" < "$jar" >/dev/null 2>"$RUNNER_TEMP/gh-err.txt"; then
            echo "Saved the refreshed cookies to YT_COOKIES."
          else
            # GitHub's reason (an HTTP status and message; it never contains the cookies).
            head -n 3 "$RUNNER_TEMP/gh-err.txt" | cut -c1-300
            echo "::warning title=YouTube session::Could not save the refreshed cookies. Check that COOKIE_REFRESH_TOKEN has 'Secrets: read and write' on this repository and has not expired."
          fi

      # Runs even when the previous step failed (e.g. bot-blocked), so that
      # status.json still records what happened and the app can show it.
      # A contributed map (map_json) is handled here too: it needs no
      # downloads, and if the push races another run it starts again from
      # the newest commit instead of rebasing (the tool is quick and deterministic).
      # Any other run merges its JSON into the newest commit instead (see below),
      # since its downloads cannot be redone cheaply.
      - name: Commit beat maps
        id: commit
        if: ${{ !cancelled() }}
        env:
          BRANCH: ${{ github.ref_name }}
          # Untrusted JSON from the relay: only ever read by the tool from the environment.
          MAP_JSON: ${{ inputs.map_json }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          stage() {
            # Only JSON under public/ is ever staged: never audio, never anything else.
            paths=(public/beatmaps)
            for f in public/playlist.json public/songs.json public/songs-status.json public/genres.json; do
              if [ -e "$f" ]; then paths+=("$f"); fi
            done
            git add -A -- "${paths[@]}"
            if git diff --cached --name-only | grep -Ev '^public/(beatmaps/[A-Za-z0-9_-]+|playlist|songs|songs-status|genres)\.json$'; then
              echo "::error title=Unexpected files::Refusing to commit files other than beat-map JSON"
              exit 1
            fi
          }
          if [ -n "${MAP_JSON:-}" ]; then
            for attempt in 1 2 3 4 5; do
              npm run --silent beatmaps -- --contributed-map
              stage
              if git diff --cached --quiet; then
                echo "No changes to commit."
                echo "changed=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              git commit -q -m "Contributed beat map (heard in a browser)"
              if git push -q origin "HEAD:${BRANCH}"; then break; fi
              if [ "$attempt" = 5 ]; then exit 1; fi
              sleep $((attempt * 3))
              git fetch -q origin "$BRANCH"
              git reset -q --hard "origin/${BRANCH}"
            done
          else
            stage
            if git diff --cached --quiet; then
              echo "No changes to commit."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            count=$(git diff --cached --name-only -- 'public/beatmaps/*.json' | grep -Evc '/(index|status)\.json$' || true)
            msg="Update beat maps (${count} map file(s) changed)"
            if ! git diff --cached --quiet -- public/songs.json 2>/dev/null; then msg="Add song(s) by search; ${msg}"; fi
            git commit -q -m "$msg"
            # Another run (a contributed map, which runs alongside this one) or a person may have
            # pushed meanwhile. A textual rebase then conflicts on the shared JSON (every file has
            # a timestamp, and both runs add entries side by side), and this run's downloads would
            # be thrown away. Instead: start from the new tip and lay this run's changes over it,
            # merging the shared files entry by entry so neither side's songs, maps or notes are
            # lost (tools/beatmaps/mergeData.ts). If that cannot be done safely it stops with an
            # error rather than guess. Each retry merges this run's last commit onto the newest tip.
            base=$(git rev-parse HEAD~1)
            for attempt in 1 2 3 4 5; do
              if git push -q origin "HEAD:${BRANCH}"; then break; fi
              if [ "$attempt" = 5 ]; then
                echo "::error title=Could not push::The branch kept moving; gave up after 5 tries. This run's work was not pushed."
                exit 1
              fi
              sleep $((attempt * 2))
              ours=$(git rev-parse HEAD)
              git fetch -q origin "$BRANCH"
              theirs=$(git rev-parse "origin/${BRANCH}")
              echo "Push rejected: merging this run's changes onto ${theirs:0:7}."
              git reset -q --hard "$theirs"
              npx --no-install tsx tools/beatmaps/mergeData.ts --base "$base" --ours "$ours" --theirs "$theirs"
              stage
              if git diff --cached --quiet; then
                echo "The newer commit already has everything this run made; nothing to push."
                echo "changed=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              git commit -q -m "$msg"
              base="$theirs"
            done
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Last, so the commit above still happens: turn the run red on the run that
      # sees YouTube reject the sign-in (later runs only warn, see the step above).
      - name: YouTube rejected the sign-in
        if: ${{ !cancelled() && steps.session.outputs.rejected == 'true' }}
        run: |
          echo "::error title=YouTube rejected the sign-in::Export fresh cookies from the spare account into the YT_COOKIES secret."
          exit 1

  # Pushes made with GITHUB_TOKEN don't trigger deploy.yml, so deploy from here.
  deploy:
    needs: update
    if: ${{ always() && needs.update.outputs.changed == 'true' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.update.outputs.sha }}
      # This job commits only song data (the commit step refuses anything else).
      data_only: true
